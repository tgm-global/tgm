<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | bookflights.online</title>
<meta name="description" content="Contact bookflights.online by phone, email or the contact form. We reply to flight, hotel, car, cruise and package questions.">
<link rel="canonical" href="https://bookflights.online/contact.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="site.css">
<script src="data.js"></script>
<script>window.PAGE = { crumbs: [['Contact']] };</script>
<script src="layout.js" defer></script>
</head>
<body>
<section class="phero">
  <div class="wrap">
    <p class="eyebrow">Contact</p>
    <h1>Contact us</h1>
    <p class="sub">Questions about a trip or an enquiry? Call, email or send a message.</p>
  </div>
</section>

<main class="wrap">
  <section class="sec" style="margin-top:40px">
    <div class="cards">
      <a class="card-link" id="cPhone" href="#"><b>Call us</b><span id="cPhoneTxt"></span><em>Tap to call &rarr;</em></a>
      <a class="card-link" id="cMail" href="#"><b>Email us</b><span id="cMailTxt"></span><em>Send an email &rarr;</em></a>
      <div class="card-link"><b>Follow us</b><div class="pills" id="cSocial" style="margin-top:6px"></div></div>
    </div>
  </section>

  <section class="sec">
    <h2>Send a message</h2>
    <p class="lead">For a flight, hotel, car, cruise or package request, please use the <a href="index.html#search">flight search</a> or the product page enquiry forms.</p>
    <form class="panel" action="https://api.web3forms.com/submit" method="POST" style="max-width:720px">
      <input type="hidden" name="access_key" value="036dbdb1-0c9d-4296-a846-677c36667a17">
      <input type="hidden" name="subject" value="New Contact Message - bookflights.online">
      <input type="hidden" name="from_name" value="bookflights.online">
      <input type="hidden" name="redirect" id="cRedirect" value="">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="form-grid">
        <div class="form-group"><label for="c_name">Full name *</label><input id="c_name" name="Full_Name" type="text" required></div>
        <div class="form-group"><label for="c_email">Email address *</label><input id="c_email" name="Email_Address" type="email" required></div>
      </div>
      <div class="form-group"><label for="c_phone">Phone number</label><input id="c_phone" name="Phone_Number" type="tel"></div>
      <div class="form-group"><label for="c_msg">Message *</label><textarea id="c_msg" name="Message" required></textarea></div>
      <label class="consent"><input type="checkbox" name="Consent" value="Yes" required><span>I agree to be contacted about this message and have read the <a href="privacy-policy.html">Privacy Policy</a>.</span></label>
      <button class="btn-submit" type="submit">Send message</button>
    </form>
  </section>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var C = window.BF_CONFIG, esc = window.BF.esc;
  document.getElementById('cRedirect').value = new URL('thankyou.html', location.href).href;
  document.getElementById('cPhone').href = 'tel:+' + C.phoneTel.replace(/\D/g, '');
  document.getElementById('cPhoneTxt').textContent = C.phoneDisplay;
  document.getElementById('cMail').href = 'mailto:' + C.email;
  document.getElementById('cMailTxt').textContent = C.email;
  document.getElementById('cSocial').innerHTML = C.social.map(function (s) {
    return '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener noreferrer me">' + esc(s[0]) + '</a>';
  }).join('');
});
</script>
</body>
</html>
